    var now=new Date().toISOString();
    cur.status='confirmed';cur.notice=null;cur.reviewerEdits=[];
    cur.history=cur.history.concat([{at:now,type:'confirm',by:u.id,v:cur.rev}]).slice(-40);
    await api.putSub(u.id,cur);
  },'已確認，等審稿員定稿');
}
/* ---------- 結案數據動作 ---------- */
async function closeReview(decision){
  var id=state.sel,u=me();
  if(!allow('confirmClose'))return;
  var msg=(state.cmsg[id]||'').trim();
  if(decision==='returned'&&!msg){state.cerr='退回補件時，請寫下需要補什麼。';render();var n=$('#cmsg');if(n)n.focus();return;}
  state.cerr='';
  var ok=await guarded(async function(){
    var cur=await api.getSub(id);
    if(!cur||!cur.close||cur.close.status!=='submitted')throw {userMsg:'這份數據目前不在待確認狀態，請重新整理。'};
    var now=new Date().toISOString();
    cur.close.status=decision==='closed'?'closed':'returned';
    cur.close.review={decision:decision,by:u.id,at:now,note:msg};
    if(decision==='closed')cur.close.closedAt=now;
    cur.history=cur.history.concat([{at:now,type:decision==='closed'?'closeDone':'closeReturn',by:u.id,v:cur.rev,note:msg}]).slice(-40);
    await api.putSub(id,cur);
  },decision==='closed'?'已結案':'已退回補件');
  if(ok)state.cmsg[id]='';
}
async function setPaid(on){
  var id=state.sel,u=me();
  if(!allow('markPaid'))return;
  await guarded(async function(){
    var cur=await api.getSub(id);
    if(!cur||!cur.close||cur.close.status!=='closed')throw {userMsg:'這份稿件還沒有結案。'};
    var now=new Date().toISOString();
    cur.close.paid=on?{at:now,by:u.id,date:todayStr()}:null;
    cur.history=cur.history.concat([{at:now,type:on?'paid':'unpaid',by:u.id,v:cur.rev}]).slice(-40);
    await api.putSub(id,cur);
  },on?'已標記為已付款':'已撤銷付款標記');
}
function ensureCDraft(s){
  var id=me().id,at=s.close?s.close.submittedAt:'';
  if(!state.cdraft||state.cdraft.id!==id||(!state.cdraft.dirty&&state.cdraft.at!==at)){
    var blocks={};
    closeBlocks(s).forEach(function(b){
      var d=(s.close&&s.close.blocks&&s.close.blocks[b.key])||{};
      blocks[b.key]={views:d.views!=null?String(d.views):'',inter:d.inter!=null?String(d.inter):'',accounts:d.accounts!=null?String(d.accounts):'',note:d.note||'',shots:(d.shots||[]).slice()};
    });
    state.cdraft={id:id,at:at,blocks:blocks,dirty:false,edit:false,errors:[]};
  }
}
async function addShots(key,fileList){
  var d=state.cdraft;
  if(!d||!d.blocks[key])return;
  var list=Array.from(fileList||[]).filter(function(f){return /^image\//.test(f.type);});
  if(!list.length){toast('請上傳圖片檔（後台數據截圖）。','err');return;}
  var room=4-d.blocks[key].shots.length;
  if(room<=0){toast('每個區塊最多 4 張截圖。','err');return;}
  list=list.slice(0,room);
  state.uploading+=list.length;render();
  for(var i=0;i<list.length;i++){
    try{d.blocks[key].shots.push(await uploadOne(list[i]));d.dirty=true;}
    catch(e){toast((e&&e.userMsg)||'上傳失敗，請稍後再試。','err');}
    state.uploading--;
  }
  render();
}
async function submitClose(){
  var u=me(),s0=state.subs[u.id],d=state.cdraft;
  if(!s0||!d)return;
  if(state.uploading>0){toast('檔案還在上傳，請稍候。');return;}
  var errs=[],blocks={};
  closeBlocks(s0).forEach(function(b){
    var x=d.blocks[b.key]||{views:'',inter:'',accounts:'',note:'',shots:[]},ok=true,v={};
    [['views','瀏覽次數'],['inter','互動次數'],['accounts','互動帳號']].forEach(function(f){
      var t=String(x[f[0]]||'').replace(/[,\s]/g,'');
      if(!/^\d{1,10}$/.test(t)){errs.push(b.label+'：請填寫'+f[1]+'（只填數字）。');ok=false;}else v[f[0]]=+t;
    });
    if(ok&&v.accounts>v.inter)errs.push(b.label+'：互動帳號不會比互動次數多，請再確認數字。');
    if(!x.shots.length)errs.push(b.label+'：請上傳至少一張後台數據截圖。');
    blocks[b.key]={views:v.views,inter:v.inter,accounts:v.accounts,note:(x.note||'').trim(),shots:x.shots};
  });
  d.errors=errs;
  if(errs.length){render();var el=$('#close-form .errs');if(el&&el.scrollIntoView)el.scrollIntoView({block:'center'});return;}
  var ok=await guarded(async function(){
    var cur=await api.getSub(u.id);
    if(!cur||cur.status!=='approved')throw {userMsg:'稿件目前不是「已定稿」狀態，暫時不能上傳結案數據。'};
    if(cur.close&&cur.close.status==='closed')throw {userMsg:'這份稿件已經結案，不能再更新數據。'};
    var now=new Date().toISOString(),due=metricsDue(cur);
    cur.close={status:'submitted',blocks:blocks,submittedAt:now,submittedBy:u.id,due:due,late:!!due&&todayStr()>due,review:null,paid:null};
    cur.history=cur.history.concat([{at:now,type:'closeSubmit',by:u.id,v:cur.rev}]).slice(-40);
    await api.putSub(u.id,cur);
  },'結案數據已送出，等審稿員確認');
  if(ok){state.cdraft=null;render();}
}
async function saveDeadline(deadlineIso){
  var iso=deadlineIso;
  if(!iso){
    var v=($('#dl-input')||{}).value,t=v?Date.parse(v+':00+08:00'):NaN;
    if(isNaN(t)){toast('請先選好截稿日期與時間。','err');return;}
    iso=new Date(t).toISOString();
  }
  await guarded(async function(){var c=clone(state.campaign);c.deadline=iso;await api.putCampaign(c);},'已更新截稿時間');
}
async function seedAll(){
  var s=demoSeed(Date.now()),u=me(),i;
  await api.putCampaign(s.campaign);
  var ids=Object.keys(s.accounts);
  for(i=0;i<ids.length;i++)await api.putAccount(ids[i],s.accounts[ids[i]]);
  var extra=state.accounts.filter(function(a){return !s.accounts[a.id]&&(!u||a.id!==u.id);});
  for(i=0;i<extra.length;i++){await api.delAccount(extra[i].id);await api.delSub(extra[i].id);await api.delBrief(extra[i].id);}
  var fk0=Object.keys(s.files||{});
  for(i=0;i<fk0.length;i++)await api.putFile(fk0[i],s.files[fk0[i]]);
  var cs=ids.filter(function(k){return s.accounts[k].role==='creator';});
  for(i=0;i<cs.length;i++){
    if(s.subs[cs[i]])await api.putSub(cs[i],s.subs[cs[i]]);else await api.delSub(cs[i]);
    if(s.briefs[cs[i]])await api.putBrief(cs[i],s.briefs[cs[i]]);else await api.delBrief(cs[i]);
  }
  state.review={};state.msg={};state.editing=null;state.draft=null;state.dirty=false;state.payView={};
  try{
    var pk=Object.keys(s.pay.forms),fk=Object.keys(s.pay.files),ck=Object.keys(s.pay.contracts||{});
    for(i=0;i<pk.length;i++)await api.putPay(s.pay.uid,pk[i],s.pay.forms[pk[i]]);
    for(i=0;i<fk.length;i++)await api.putPayFile(s.pay.uid,fk[i],s.pay.files[fk[i]]);
    for(i=0;i<ck.length;i++)await api.putContract(s.pay.uid,ck[i],s.pay.contracts[ck[i]]);
    var cf=Object.keys(s.fees.creator),bf=Object.keys(s.fees.brand);
    for(i=0;i<cf.length;i++)await api.putCreatorFee(cf[i],s.fees.creator[cf[i]]);
    for(i=0;i<bf.length;i++)await api.putBrandFee(bf[i],s.fees.brand[bf[i]]);
  }catch(e){toast('示範的匯款、費用與合約資料沒有寫入（需要編輯者以上權限），其餘資料已重設。','err');}
}
async function resetDemo(){
  if(!state.resetArm){
    state.resetArm=true;render();
    setTimeout(function(){if(state.resetArm){state.resetArm=false;render();}},5000);
    return;
  }
  state.resetArm=false;
  await guarded(seedAll,'已重設為示範資料');
}
async function addAccount(){
  if(!allow('manageAccounts'))return;
  var f=state.accForm,name=f.name.trim(),id=f.id.trim().toLowerCase(),pw=f.pw;
  f.err='';
  if(!name)f.err='請填寫顯示名稱。';
  else if(!/^[a-z0-9_-]{3,20}$/.test(id))f.err='登入帳號請用 3–20 個英文小寫、數字、- 或 _。';
  else if(acc(id))f.err='這個帳號已經有人使用。';
  else if(pw.length<4)f.err='密碼至少要 4 個字。';
  if(f.err){render();return;}
  var used={};reviewers().forEach(function(r){used[r.hue]=1;});
  var hue=f.role==='reviewer'?(f.hue!=null?f.hue:(HUES.filter(function(x){return !used[x.h];})[0]||HUES[0]).h):Math.floor(Math.random()*360);
  var ok=await guarded(async function(){
    var ex=await api.getAccount(id);if(ex)throw {userMsg:'這個帳號已經有人使用。'};
    var rec={id:id,name:name,role:f.role,pw:pw,hue:hue};
    if(f.role==='creator')rec.platform=f.platform;
    else rec.level=(+f.level===5?5:1);
    await api.putAccount(id,rec);
  },'已新增帳號：'+name);
  if(ok)state.accForm={role:f.role,name:'',id:'',pw:'',hue:null,level:1,platform:'Instagram',err:''};
  render();
}
async function setLevel(id,n){
  var a=acc(id);
  if(!a||!isRev(a)||!allow('manageAccounts'))return;
  if(id===me().id){toast('不能調整自己的等級。','err');render();return;}
  if(!LEVELS.some(function(l){return l.n===n&&!l.reserved;})){render();return;}
  await guarded(async function(){
    var cur=await api.getAccount(id);if(!cur)throw {userMsg:'找不到這個帳號。'};
    cur.level=n;await api.putAccount(id,cur);
  },a.name+' 已設為 '+levelLabel(n));
}
async function delAccount(id){
  if(!allow('manageAccounts'))return;
  if(state.delArm!==id){
    state.delArm=id;render();
    setTimeout(function(){if(state.delArm===id){state.delArm=null;render();}},5000);
    return;
  }
  state.delArm=null;
  var a=acc(id);if(!a)return;
  await guarded(async function(){
    if(a.role==='creator'){await api.delSub(id);await api.delBrief(id);}
    await api.delAccount(id);
  },'已移除帳號：'+a.name);
}
function act(name,el){
  switch(name){
    case 'fill':{var a=acc(el.dataset.id);if(a){state.loginId=a.id;state.loginPw=a.pw;state.loginErr='';render();}break;}
    case 'logout':doLogout();break;
    case 'toggleAcc':
      if(state.view==='main'&&!allow('manageAccounts')){toast('帳號管理只有 LV 審稿員可以使用。','err');break;}
      if(state.editing&&state.dirty){toast('請先儲存或取消目前的編修。');break;}
      state.view=state.view==='main'?'accounts':'main';state.editing=null;state.draft=null;render();break;
    case 'newBrief':
      if(state.editing&&state.dirty){toast('請先儲存或取消目前的編修。');break;}
      state.editing=null;state.draft=null;state.brief={target:null,f:blankBriefForm()};state.view='brief';render();window.scrollTo(0,0);break;
    case 'openBrief':
      if(state.editing&&state.dirty){toast('請先儲存或取消目前的編修。');break;}
      state.editing=null;state.draft=null;state.brief={target:el.dataset.id,f:briefFormFrom(state.briefs[el.dataset.id]||{},el.dataset.id)};state.view='brief';render();window.scrollTo(0,0);break;
    case 'cancelBrief':state.view='main';state.brief={target:null,f:null};render();break;
    case 'select':
      if(state.editing&&state.editing!==el.dataset.id){
        if(state.dirty){toast('請先儲存或取消目前的編修。');break;}
        state.editing=null;state.draft=null;
      }
      state.sel=el.dataset.id;state.mobileDetail=true;state.reviewErr='';render();
      if(window.matchMedia('(max-width:860px)').matches)window.scrollTo(0,0);break;
    case 'back':
      if(state.editing&&state.dirty){toast('請先儲存或取消目前的編修。');break;}
      state.editing=null;state.draft=null;state.mobileDetail=false;render();break;
    case 'filter':state.filter=el.dataset.v;render();break;
    case 'tile':
      if(state.editing&&state.dirty){toast('請先儲存或取消目前的編修。');break;}
      state.filter=el.dataset.k;state.dash='list';state.mobileDetail=false;state.editing=null;state.draft=null;
      var first=filteredCreators()[0];if(first)state.sel=first.id;
      render();break;
    case 'dash':
      if(state.editing&&state.dirty){toast('請先儲存或取消目前的編修。');break;}
      state.dash=el.dataset.v;if(state.dash==='cal'){state.editing=null;state.draft=null;state.mobileDetail=false;}render();break;
    case 'calPrev':calInit();state.calM--;if(state.calM<0){state.calM=11;state.calY--;}render();break;
    case 'calNext':calInit();state.calM++;if(state.calM>11){state.calM=0;state.calY++;}render();break;
    case 'calToday':{state.calY=null;calInit();render();break;}
    case 'calGo':state.calY=+el.dataset.y;state.calM=+el.dataset.m;render();break;
    case 'calDay':state.calSel=el.dataset.d;render();break;
    case 'calOpen':
      state.sel=el.dataset.id;state.dash='list';state.mobileDetail=true;state.reviewErr='';state.filter='all';render();window.scrollTo(0,0);break;
    case 'startEdit':startEdit();break;
    case 'cancelEdit':cancelEdit();break;
    case 'reloadDraft':reloadDraft();break;
    case 'notify':notifyCreator();break;
    case 'approve':approve();break;
    case 'reopen':reopen();break;
    case 'confirm':confirmByCreator();break;
    case 'gotoForm':{var f=$('#sub-form');if(f&&f.scrollIntoView)f.scrollIntoView({behavior:'smooth',block:'start'});break;}
    case 'payEdit':state.draft.payEdit=true;state.draft.pay=blankPay();state.dirty=true;render();break;
    case 'payCancel':state.draft.payEdit=false;state.draft.pay=blankPay();render();break;
    case 'zoom':el.classList.toggle('big');break;
    case 'closeOk':closeReview('closed');break;
    case 'closeReturn':closeReview('returned');break;
    case 'markPaid':setPaid(true);break;
    case 'unpaid':setPaid(false);break;
    case 'closeEdit':if(state.cdraft){state.cdraft.edit=true;render();}break;
    case 'closeCancel':state.cdraft=null;render();break;
    case 'rmShot':{var cb=state.cdraft&&state.cdraft.blocks[el.dataset.k];if(cb){cb.shots.splice(+el.dataset.i,1);state.cdraft.dirty=true;render();}break;}
    case 'exportCsv':exportCsv();break;
    case 'dlPay':dlPayImage(el.dataset.k);break;
    case 'copy':{
      var tx=el.dataset.text||'';
      try{navigator.clipboard.writeText(tx).then(function(){toast('已複製');},function(){toast('無法自動複製，請手動選取。','err');});}
      catch(e){toast('無法自動複製，請手動選取。','err');}
      break;
    }
    case 'addLink':addLink();break;
    case 'rmMat':state.draft.materials.splice(+el.dataset.i,1);state.dirty=true;render();break;
    case 'addSl':state.draft.storyLinks.push('');state.dirty=true;render();break;
    case 'rmSl':state.draft.storyLinks.splice(+el.dataset.i,1);if(!state.draft.storyLinks.length)state.draft.storyLinks=[''];state.dirty=true;render();break;
    case 'saveDeadline':saveDeadline();break;
    case 'closeNow':saveDeadline(new Date(Date.now()-60000).toISOString());break;
    case 'extend':saveDeadline(nextDeadlineISO());break;
    case 'reset':if(allow('resetDemo'))resetDemo();break;
    case 'loadDemo':if(allow('resetDemo'))guarded(seedAll,'已載入示範資料');else toast('載入示範資料需要 LV 審稿員。','err');break;
    case 'delAcc':delAccount(el.dataset.id);break;
  }
}

/* ---------- 事件 ---------- */
function syncField(t){
  if(t.dataset&&t.dataset.f&&state.draft){
    state.draft[t.dataset.f]=t.value;state.dirty=true;
    if(t.dataset.f==='body'){var c=$('#count');if(c)c.textContent=wc(t.value)+' 字';}
  }else if(t.id==='cmsg'&&state.sel){
    state.cmsg[state.sel]=t.value;
  }else if(t.dataset&&t.dataset.cm&&state.cdraft){
    var kp=t.dataset.cm.split('|'),cb=state.cdraft.blocks[kp[0]];
    if(cb){cb[kp[1]]=t.value;state.cdraft.dirty=true;}
  }else if(t.dataset&&t.dataset.p&&state.draft){
    state.draft.pay[t.dataset.p]=t.value;state.dirty=true;
  }else if(t.dataset&&t.dataset.sl!=null&&state.draft){
    state.draft.storyLinks[+t.dataset.sl]=t.value;state.dirty=true;
  }else if(t.id==='msg'&&state.sel){
    state.msg[state.sel]=t.value;
  }else if(t.id==='q'){
    state.q=t.value;if(!composing)renderList();
  }else if(t.dataset&&t.dataset.af){
    if(t.type==='radio'){if(t.checked)state.accForm.hue=+t.value;}
    else state.accForm[t.dataset.af]=t.value;
  }else if(t.dataset&&t.dataset.bf&&state.brief.f){
    state.brief.f[t.dataset.bf]=t.value;
  }
}
function wire(){
  var app=$('#app');
  app.addEventListener('click',function(e){
    var b=e.target.closest('[data-act]');
    if(!b||b.disabled)return;
    act(b.dataset.act,b);
  });
  app.addEventListener('input',function(e){if(e.target.type==='file')return;syncField(e.target);});
  app.addEventListener('change',function(e){
    var t=e.target;
    if(t.type==='file'){
      if(t.dataset.pay)addPayFile(t.dataset.pay,t.files[0]);
      else if(t.dataset.cshot)addShots(t.dataset.cshot,t.files);
      else addFiles(t.files);
      t.value='';return;
    }
    if(t.dataset&&t.dataset.lv){setLevel(t.dataset.lv,+t.value);return;}
    if(t.dataset&&t.dataset.chk!=null&&state.sel&&state.review[state.sel]){
      var r=state.review[state.sel];r.checks[+t.dataset.chk]=t.checked;
      var c=$('#chkcount');if(c)c.textContent=r.checks.filter(Boolean).length+' / '+CHECKS.length;
    }else if(t.dataset&&t.dataset.cl&&state.draft){
      state.draft.cl[+t.dataset.cl]=t.checked;state.dirty=true;
      var cc=$('#clcount');if(cc)cc.textContent=Object.keys(state.draft.cl).filter(function(k){return state.draft.cl[k];}).length+' / '+document.querySelectorAll('[data-cl]').length;
    }else if(t.dataset&&t.dataset.pf&&state.draft){
      var list=state.draft.platforms,i=list.indexOf(t.dataset.pf);
      if(t.checked&&i<0)list.push(t.dataset.pf);else if(!t.checked&&i>=0)list.splice(i,1);
      state.dirty=true;render();
    }else if(t.dataset&&t.dataset.bpf&&state.brief.f){
      var bl=state.brief.f.platforms,bi=bl.indexOf(t.dataset.bpf);
      if(t.checked&&bi<0)bl.push(t.dataset.bpf);else if(!t.checked&&bi>=0)bl.splice(bi,1);
      render();
    }else if(t.dataset&&t.dataset.f){syncField(t);}
    else if(t.dataset&&t.dataset.bf){syncField(t);}
    else if(t.dataset&&t.dataset.af){syncField(t);if(t.id==='a-role')render();}
  });
  app.addEventListener('toggle',function(e){if(e.target.id==='dl-details')state.dlOpen=e.target.open;},true);
  app.addEventListener('submit',function(e){
    e.preventDefault();
    if(e.target.id==='login-form')doLogin();
    else if(e.target.id==='sub-form')saveContent();
    else if(e.target.id==='acc-form')addAccount();
    else if(e.target.id==='brief-form')saveBrief();
    else if(e.target.id==='close-form')submitClose();
  });
  app.addEventListener('keydown',function(e){
    if(e.key==='Enter'&&e.target.tagName==='INPUT'&&e.target.closest('#sub-form,#brief-form,#close-form')&&e.target.type!=='checkbox'){
      e.preventDefault();
      if(e.target.id==='f-link')addLink();
    }
  });
  app.addEventListener('compositionstart',function(){composing=true;});
  app.addEventListener('compositionend',function(e){
    composing=false;syncField(e.target);
    if(pendingRender)render();
    else if(e.target.id==='q')renderList();
  });
  setInterval(function(){
    if(!state.campaign||!me())return;
    var closed=isClosed();
    if(closed!==lastClosed){scheduleRender();return;}
    var cd=countdown();
    document.querySelectorAll('[data-cd]').forEach(function(n){
      n.textContent=cd.text;n.classList.toggle('urgent',cd.urgent);n.classList.toggle('closed',cd.closed);
    });
  },30000);
}

wire();
boot();
})();
</script>
<style>
.cloud-wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-bottom:56px}
.cloud h2{font:700 20px/1.4 var(--f-serif);margin:2px 0 4px}
.cloud-list{display:grid;margin:16px 0}
.cloud-row{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.cloud-row:last-child{border-bottom:0}
.cloud-row .nm{font-weight:500;overflow-wrap:anywhere}
.cloud-row .fans{min-width:4.5em;text-align:right;font-size:13px;color:var(--ink-2);font-family:var(--f-mono)}
.cloud-form{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) minmax(0,1fr) auto;gap:12px;align-items:end;padding-top:16px;border-top:1px solid var(--line)}
.cloud-msg{min-height:1.5em;font-size:13.5px;margin-top:10px}
@media (max-width:700px){
  .cloud-form{grid-template-columns:minmax(0,1fr)}
  .cloud-row{grid-template-columns:minmax(0,1fr) auto}
  .cloud-row .fans{grid-column:1 / -1;text-align:left}
}
</style>

<div class="cloud-wrap" id="cloud" hidden>
  <section class="card pad cloud" aria-labelledby="cloud-h">
    <p class="eyebrow">SUPABASE 雲端資料庫</p>
    <h2 id="cloud-h">合作人選名單</h2>
    <p class="muted small">這份名單存在雲端資料庫，每個人打開都看得到，也可以新增。請只填公開的名稱與平台，不要填個人資料。</p>
    <ul class="cloud-list" id="cloud-list" aria-live="polite"><li class="muted small">讀取中…</li></ul>
    <form class="cloud-form" id="cloud-form" novalidate>
      <div class="fld"><label for="cl-name">名稱</label><input id="cl-name" maxlength="40" autocomplete="off" placeholder="例如：test"></div>
      <div class="fld"><label for="cl-plat">平台</label>
        <select id="cl-plat"><option>Instagram</option><option>Facebook</option><option>Threads</option><option>YouTube</option><option>部落格</option><option>其他</option></select></div>
      <div class="fld"><label for="cl-fans"><span>追蹤數</span><span class="opt">選填</span></label><input id="cl-fans" maxlength="20" autocomplete="off" placeholder="例如：3.2 萬"></div>
      <button class="btn primary" type="submit" id="cl-btn">新增</button>
    </form>
    <p class="cloud-msg" id="cl-msg" role="status"></p>
  </section>
</div>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";

// 只放專案網址與 Publishable key，這兩樣可以公開。
// 絕不放 service_role、sb_secret 或資料庫密碼。
const SUPABASE_URL = "https://wmbrxtuvjuxojvisvlsu.supabase.co";
const SUPABASE_KEY = "sb_publishable_4Mxyi-egLN4Woj9YCHBjfg_SjNR-xqi";
const sb = createClient(SUPABASE_URL, SUPABASE_KEY);

const box = document.getElementById("cloud");
const list = document.getElementById("cloud-list");
const form = document.getElementById("cloud-form");
const msg = document.getElementById("cl-msg");
const btn = document.getElementById("cl-btn");

function say(text, bad) {
  msg.textContent = text;
  msg.style.color = bad ? "var(--bad)" : "var(--ink-2)";
}
function note(text) {
  const li = document.createElement("li");
  li.className = "muted small";
  li.textContent = text;
  return li;
}
// 名單內容是任何人都能新增的，一律用 textContent 放進畫面，不當成 HTML。
function row(c) {
  const li = document.createElement("li");
  li.className = "cloud-row";
  const nm = document.createElement("span");
  nm.className = "nm";
  nm.textContent = c.name;
  const plat = document.createElement("span");
  plat.className = "pill st-none";
  plat.textContent = c.platform;
  const fans = document.createElement("span");
  fans.className = "fans";
  fans.textContent = c.fans || "";
  li.append(nm, plat, fans);
  return li;
}

async function load() {
  const { data, error } = await sb
    .from("creators")
    .select("id,name,platform,fans,created_at")
    .order("created_at", { ascending: false })
    .limit(50);
  if (error) {
    list.replaceChildren(note("目前讀不到雲端名單：" + error.message));
    return;
  }
  list.replaceChildren(...(data.length ? data.map(row) : [note("名單還是空的，新增第一位吧。")]));
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const name = document.getElementById("cl-name").value.trim();
  const platform = document.getElementById("cl-plat").value;
  const fans = document.getElementById("cl-fans").value.trim();
  if (!name) { say("請先填寫名稱。", true); return; }
  btn.disabled = true;
  say("新增中…");
  const { error } = await sb.from("creators").insert({ name, platform, fans: fans || null });
  btn.disabled = false;
  if (error) { say("新增失敗：" + error.message, true); return; }
  document.getElementById("cl-name").value = "";
  document.getElementById("cl-fans").value = "";
  say("已新增，重新整理頁面後也會還在。");
  await load();
});

// 只在登入畫面顯示這個區塊（登入後的系統畫面不受影響）。
const app = document.getElementById("app");
const sync = () => { box.hidden = !document.getElementById("login-form"); };
new MutationObserver(sync).observe(app, { childList: true });
sync();
load();
</script>
</body>
</html>
